    <title>Book Your Trip</title>

            text-decoration: underline;
        }

        fieldset {
            width: 80%;
            margin: auto;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;

        input, select, textarea {

            padding: 6px;

        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        .buttons input {
            width: auto;
            padding: 10px 20px;
            margin: 5px;
            background-color: cornflowerblue;
            border: none;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
